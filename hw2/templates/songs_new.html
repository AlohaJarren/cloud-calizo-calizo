{% extends "base.html" %} {% block title %}Add Song - Songs MVP{% endblock %} {%
block content %}
<h2>Add Song</h2>

<form action="{{ url_for('songs_create') }}" method="post" novalidate>
  <div class="grid">
    <label
      >Song title
      <input
        type="text"
        name="title"
        value="{{ prev.get('title', '') }}"
        required
        autocomplete="off"
      />
    </label>

    <label
      >Genre
      <input type="text" name="genre" value="{{ prev.get('genre', '') }}" />
    </label>

    <label
      >Performer
      <input
        type="text"
        name="performer"
        value="{{ prev.get('performer', '') }}"
      />
    </label>

    <label
      >Writer
      <input type="text" name="writer" value="{{ prev.get('writer', '') }}" />
    </label>

    <label
      >Release year (YYYY)
      <input
        type="number"
        name="release_year"
        min="0"
        step="1"
        value="{{ prev.get('release_year', '') }}"
      />
    </label>

    <label
      >Release month (1-12)
      <input
        type="number"
        name="release_month"
        min="1"
        max="12"
        step="1"
        value="{{ prev.get('release_month', '') }}"
      />
    </label>

    <label
      >Lyrics
      <textarea name="lyrics">{{ prev.get('lyrics', '') }}</textarea>
    </label>

    <label
      >Rating (0-10)
      <input
        type="number"
        name="rating"
        min="0"
        max="10"
        step="1"
        value="{{ prev.get('rating', '') }}"
      />
    </label>

    <label
      >URL
      <input
        type="url"
        name="url"
        placeholder="https://..."
        value="{{ prev.get('url', '') }}"
      />
    </label>
  </div>

  <p><button type="submit">Create</button></p>
</form>
{% endblock %}
